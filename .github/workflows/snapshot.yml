# Rebuild the shared price snapshot every 4 hours and publish it, with the
# privacy page, on GitHub Pages.
name: snapshot

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Starts from the live snapshot, so only stale prices are refetched.
      - run: node snapshot.js "https://kdenkc.github.io/plat-planner-data/snapshot.json"
      - run: cp pages/* public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
